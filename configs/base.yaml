# Base configuration — shared across all experiments.
# Per-experiment YAMLs in configs/experiments/ layer on top via pydantic-settings.
#
# Concrete fields are committed once docs/pydantic_settings.md is filled and
# src/calibrated_nla/settings.py lands (plan §5.7).

paths:
  results_root: ~/LocalProjects/nla_token_selector/results
  corpus_parquet: ~/LocalProjects/nla_token_selector/results/corpus/fineweb_6k.parquet

