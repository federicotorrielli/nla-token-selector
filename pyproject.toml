[project]
name = "nla-token-selector"
version = "0.1.0"
description = "Which token deserves an NLA explanation: cheap pre-pass signals for injection and deception."
authors = [{ name = "Federico Torrielli", email = "federico.torrielli@unito.it" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "polars>=1.43.2",
    "scipy>=1.18.0",
    "pyarrow>=25.0.0",
    "sentence-transformers>=5.7.0",
    "sglang==0.5.17",
    "orjson>=3.11.9",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nla_token_selector"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/nla_token_selector/_nla_inference.py"]  # vendored 1:1, keep upstream

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false
